server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset      utf-8;
    charset_types text/html text/css application/javascript;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; connect-src https://api.nal.usda.gov https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
