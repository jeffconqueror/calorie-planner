<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Not found · 页面不存在 — Load</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<style>
  :root{
    color-scheme:light;
    --ground:#E7E8E4; --panel:#FAFAF8; --ink:#14181A; --ink-3:#868E93;
    --rule:#D3D6D1; --accent:#1D5AA8;
  }
  @media (prefers-color-scheme:dark){
    :root{ color-scheme:dark;
      --ground:#101315; --panel:#1E2225; --ink:#EAEDEE; --ink-3:#6C767B;
      --rule:#2C3236; --accent:#7FB0F0; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--ground); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC",
                "Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.6;
  }
  .card{
    background:var(--panel); border:1px solid var(--rule); border-radius:2px;
    padding:32px 28px; max-width:460px; width:100%;
  }
  h1{
    margin:0 0 4px; font-size:56px; line-height:1;
    font-family:"PT Sans Narrow","Liberation Sans Narrow","Roboto Condensed",system-ui,sans-serif;
    letter-spacing:.02em;
  }
  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:18px;
  }
  p{margin:0 0 8px; font-size:14.5px; color:var(--ink-3)}
  a{
    display:inline-block; margin-top:18px; color:var(--accent);
    text-decoration:underline; text-underline-offset:3px; font-size:14.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <div class="eyebrow">Page not found · 页面不存在</div>
    <p>That address doesn’t exist here. The planner lives at the site root.</p>
    <p>这个地址不存在。规划器在网站首页。</p>
    <a href="/">← Back to the planner · 返回规划器</a>
  </div>
</body>
</html>
